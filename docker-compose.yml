# Paste these services into your existing compose file, or use this file standalone.
# network_mode: host is deliberate for moonlight-web: WebRTC UDP binds straight
# to the Pi, no DNAT. certbot only needs outbound HTTPS, so it uses bridge.
services:
  moonlight-web:
    container_name: moonlight-web
    image: "mrcreativ3001/moonlight-web-stream:latest"
    pull_policy: missing                # published multi-arch image, arm64 verified
    network_mode: host                  # no ports: mapping - binds 443 + UDP 40000-40100 directly
    user: "0:0"                         # needed to bind privileged port 443 (image default user is 'moonlight')
    environment:
      - TZ=Atlantic/Azores
      - RUST_LOG=info,h2=warn,hyper=warn,tower=warn,web_server=debug,moonlight=debug   # silence h2, keep stream detail
      - LOG_LEVEL_FILTER=info
      - BIND_ADDRESS=0.0.0.0:443        # default HTTPS port, so Sidee tiles do not need :8443
      - SSL_CERTIFICATE=/moonlight-web/certs/cert.pem
      - SSL_PRIVATE_KEY=/moonlight-web/certs/key.pem
      - WEBRTC_PORT_RANGE=40000:40100
      - WEBRTC_NAT_1TO1_HOST=192.168.1.69
    volumes:
      - /mnt/ssd1/moonlight-web/certs:/moonlight-web/certs:ro
      - /mnt/ssd1/moonlight-web/data:/moonlight-web/server   # users + pairing state
      # TV-safe WebCodecs probe (VIDAA Chrome 111 throws on AV1 codec strings)
      - /mnt/ssd1/moonlight-web/static/stream.js:/moonlight-web/static/stream.js:ro
      - /mnt/ssd1/moonlight-web/static/478.js:/moonlight-web/static/478.js:ro
      - /mnt/ssd1/moonlight-web/static/stream.html:/moonlight-web/static/stream.html:ro
      # TV-sized UI + arrow-key/OK navigation (injected into index.html)
      - /mnt/ssd1/moonlight-web/static/index.html:/moonlight-web/static/index.html:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'                   # relay only, no transcode; raise if needed
    restart: unless-stopped

  # Optional: lets an old Sidee tile that still points at :8443 keep working.
  # Pure TCP passthrough, no TLS termination and no TV changes. Remove this
  # service once the tile has been re-pointed to https://moonlight.YOURDOMAIN.com/
  moonlight-tile-proxy:
    container_name: moonlight-tile-proxy
    image: "alpine/socat:latest"
    pull_policy: missing
    network_mode: host
    entrypoint: ["socat"]
    command: ["TCP-LISTEN:8443,fork,reuseaddr", "TCP:127.0.0.1:443"]
    restart: unless-stopped

  # HTTPS terminator so the stream page (HTTPS) can POST WebRTC stats to
  # TubeTV's /api/log (HTTP) without mixed-content blocking. Domain cert,
  # LAN-only, no TV/system changes. View results at http://192.168.1.69:8484/logs
  ml-metrics-proxy:
    container_name: ml-metrics-proxy
    image: "node:20-alpine"
    pull_policy: missing
    network_mode: host
    volumes:
      - /mnt/ssd1/moonlight-web/certs/cert.pem:/certs/cert.pem:ro
      - /mnt/ssd1/moonlight-web/certs/key.pem:/certs/key.pem:ro
      - /home/eddie/moonlight-web-test/files/ml-metrics-proxy.js:/app.js:ro
    command: ["node", "/app.js"]
    restart: unless-stopped

  certbot:
    container_name: certbot
    image: "certbot/dns-cloudflare:latest"
    pull_policy: missing                # official image, arm64 available
    environment:
      - TZ=Atlantic/Azores
    env_file:
      - /mnt/ssd1/moonlight-web/certbot.env   # everything stays under /mnt/ssd1
    volumes:
      - /mnt/ssd1/moonlight-web/letsencrypt:/etc/letsencrypt
      - /mnt/ssd1/moonlight-web/cloudflare.ini:/etc/cloudflare.ini:ro
      - /mnt/ssd1/moonlight-web/certbot-hooks:/hooks:ro
      - /mnt/ssd1/moonlight-web/certs:/certs
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh", "/hooks/run-certbot.sh"]
    restart: unless-stopped
