html{font-size:12px!important;-webkit-text-size-adjust:100%!important}
body{zoom:0.75!important}
.tv-focus{outline:3px solid #ffcc00!important;outline-offset:3px!important;border-radius:6px!important;background:rgba(255,204,0,.10)!important}
/* VIDAA remote has no mouse coords, so the app opens the context menu at 0,0.
   Force it into the middle of the screen with big TV-sized targets. */
#context-menu.context-menu-background{position:fixed!important;left:50%!important;top:50%!important;transform:translate(-50%,-50%)!important;z-index:9000!important;padding:12px!important}
#context-menu .context-menu-list{margin:0!important;padding:0!important}
#context-menu .context-menu-element{font-size:20px!important;line-height:1.3!important;padding:14px 24px!important;min-width:240px!important;margin:6px 0!important;white-space:nowrap!important}
</style>
<script id="tv-nav">
(function(){
  var SEL='.host-element>div, .app, .host-add, .open-settings, .back-button, button, a, input, select, .select-polyfill-display, .context-menu-element';
  var menu=document.getElementById('context-menu');
  function editable(e){var t=(e&&e.tagName||'').toLowerCase();return t==='input'||t==='textarea'||t==='select'||!!(e&&e.isContentEditable);}
  function items(){return Array.prototype.slice.call(document.querySelectorAll(SEL)).filter(function(e){
    var r=e.getBoundingClientRect(),s=getComputedStyle(e);
    return r.width>0&&r.height>0&&s.visibility!=='hidden'&&s.display!=='none';
  });}
  var idx=-1;
  // Focusing a text/number input puts the caret at position 0 in VIDAA Chrome.
  // Select the existing value instead so typing replaces it (e.g. FPS 60 -> 30).
  function focusItem(e){
    try{e.focus({preventScroll:true});}catch(err){try{e.focus();}catch(err2){}}
    if(editable(e)){
      try{e.select();}catch(err){
        try{e.setSelectionRange(e.value.length,e.value.length);}catch(err2){e.value=e.value;}
      }
    }
  }
  function mark(doFocus){
    var a=items(); if(idx>=a.length)idx=a.length-1;
    a.forEach(function(e,i){if(e.tabIndex<0)e.tabIndex=0;e.classList.toggle('tv-focus',i===idx);});
    if(doFocus!==false&&idx>=0&&a[idx])focusItem(a[idx]);
  }
  function move(dx,dy){
    var a=items(); if(!a.length)return;
    var cur=a[idx]; if(!cur){idx=0;mark();return;}
    var r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    var best=-1,score=1e18;
    a.forEach(function(e,i){
      if(i===idx)return;
      var q=e.getBoundingClientRect(),x=q.left+q.width/2,y=q.top+q.height/2;
      var fwd=(x-cx)*dx+(y-cy)*dy; if(fwd<=0)return;
      var side=Math.abs((x-cx)*dy-(y-cy)*dx),s=fwd+side*3;
      if(s<score){score=s;best=i;}
    });
    if(best>=0){idx=best;mark();}
  }
  document.addEventListener('keydown',function(e){
    var k=e.key||e.code, ae=document.activeElement;
    // Never steal the caret while a field is being edited.
    if(editable(ae)){
      if(k==='Escape'||k==='Esc'){e.preventDefault();ae.blur();idx=-1;mark();}
      return;
    }
    if(k==='ArrowRight'||k==='Right'){e.preventDefault();move(1,0);}
    else if(k==='ArrowLeft'||k==='Left'){e.preventDefault();move(-1,0);}
    else if(k==='ArrowDown'||k==='Down'){e.preventDefault();move(0,1);}
    else if(k==='ArrowUp'||k==='Up'){e.preventDefault();move(0,-1);}
    else if(k==='Enter'||k==='OK'||k==='Accept'||e.keyCode===13){
      var a=items(),t=a[idx];
      if(t){e.preventDefault();if(editable(t))focusItem(t);else t.click();}
    }
    setTimeout(function(){if(!editable(document.activeElement))mark(false);},0);
  },true);
  // When the context menu opens, jump focus straight to its first button.
  if(menu&&window.MutationObserver){
    new MutationObserver(function(){
      if(!menu.classList.contains('context-menu-disabled')){
        var first=menu.querySelector('.context-menu-element');
        if(first){var a=items(),i=a.indexOf(first);if(i>=0){idx=i;mark();}}
      }
    }).observe(menu,{attributes:true,childList:true,subtree:true,attributeFilter:['class']});
  }
  document.addEventListener('DOMNodeInserted',function(){setTimeout(function(){if(!editable(document.activeElement))mark(false);},60);});
  setInterval(function(){if(!editable(document.activeElement))mark(false);},1500);
})();
</script>
