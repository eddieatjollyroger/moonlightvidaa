<!doctype html><html lang=en class=notranslate><head><meta charset=UTF-8><meta name=google content=notranslate><title>Moonlight</title><link rel=icon href=resources/moonlight.svg sizes=any type=image/svg+xml><script src=./config.js></script><meta name=mobile-web-app-capable content=yes><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name=description content="Moonlight Web for game streaming with your pc"><link rel=manifest href=manifest.json crossorigin=use-credentials><meta name=apple-mobile-web-app-capable content=yes><meta name=apple-mobile-web-app-title content="Moonlight Web"><meta name=apple-mobile-web-app-status-bar-style content=black-translucent><script>try{const e=localStorage.getItem("mlSettings"),t=e?JSON.parse(e):null,n=!t||"zh-CN"!==t.language&&"zh"!==t.language&&"zh_CN"!==t.language?"en":"zh-CN";document.documentElement.lang=n,document.documentElement.translate=!1,document.documentElement.classList.add("notranslate")}catch(e){}</script><link rel=icon href=moonlight.svg><style id="tv-fix">
html{font-size:12px!important;-webkit-text-size-adjust:100%!important}
body{zoom:0.75!important}
.tv-focus{outline:3px solid #ffcc00!important;outline-offset:3px!important;border-radius:6px!important;background:rgba(255,204,0,.10)!important}
/* VIDAA remote has no mouse coords, so the app opens the context menu at 0,0.

#context-menu.context-menu-background{position:fixed!important;left:50%!important;top:50%!important;transform:translate(-50%,-50%)!important;z-index:9000!important;padding:12px!important}
#context-menu .context-menu-list{margin:0!important;padding:0!important}
#context-menu .context-menu-element{font-size:20px!important;line-height:1.3!important;padding:14px 24px!important;min-width:240px!important;margin:6px 0!important;white-space:nowrap!important}
</style>
<script id="tv-nav">
(function(){
  // VIDAA Chrome cannot open a native <select> with the remote. Force the
  // app's own dropdown (plain <p> rows) so OK/arrows work. Preserve all other
  // saved settings (fps, bitrate, ...).
  try{
    var _st=JSON.parse(localStorage.getItem('mlSettings')||'{}');
    if(_st.useSelectElementPolyfill!==true){
      _st.useSelectElementPolyfill=true;
      localStorage.setItem('mlSettings',JSON.stringify(_st));
    }
  }catch(e){}
  // Belt and braces: even if the standalone check is bypassed, never let the
  // stream open in a small popup. Navigate the current tile window instead.
  var _open=window.open;
  window.open=function(u){
    try{
      if(typeof u==='string'&&u.indexOf('/stream.html')>=0){
        window.location.href=u; return window;
      }
    }catch(e){}
    return _open?_open.apply(window,arguments):null;
  };
  var SEL='.host-element>div, .app, .host-add, .open-settings, .back-button, button, a, input, select, .select-polyfill-display, .select-polyfill-list p, .context-menu-element';
  var menu=document.getElementById('context-menu');
  // Sidee tiles are not "standalone", so the app opens the stream in a new
  // popup window. Force same-window navigation so the video uses the full
  // fullscreen tile viewport instead of a small popup.
  var _mm=window.matchMedia?window.matchMedia.bind(window):null;
  if(_mm)window.matchMedia=function(q){
    if(/display-mode\s*:\s*standalone/i.test(q))return{matches:true,media:q,onchange:null,addListener:function(){},removeListener:function(){},addEventListener:function(){},removeEventListener:function(){},dispatchEvent:function(){return false}};
    return _mm(q);
  };
  // Only text-like fields capture arrow keys. Range sliders, checkboxes and
  // buttons must keep normal remote navigation.
  function editable(e){
    var t=(e&&e.tagName||'').toLowerCase();
    if(t==='textarea'||(e&&e.isContentEditable))return true;
    if(t!=='input')return false;
    var ty=(e.type||'text').toLowerCase();
    return !/^(range|checkbox|radio|button|submit|reset|file|color|image)$/.test(ty);
  }
  function items(){return Array.prototype.slice.call(document.querySelectorAll(SEL)).filter(function(e){
    var r=e.getBoundingClientRect(),s=getComputedStyle(e);
    return r.width>0&&r.height>0&&s.visibility!=='hidden'&&s.display!=='none';
  });}
  var idx=-1;
  // Focusing a text/number input puts the caret at position 0 in VIDAA Chrome.
  // Select the existing value instead so typing replaces it (e.g. FPS 60 -> 30).
  function focusItem(e){
    try{e.focus({preventScroll:true});}catch(err){try{e.focus();}catch(err2){}}
    if(!editable(e)||e.dataset.tvEdit)return;
    e.dataset.tvEdit='1';
    if((e.type||'').toLowerCase()==='number'){
      // VIDAA Chrome ignores select() on number inputs: typed digits end up
      // appended to the old value. Clear it while editing, restore if untouched.
      e.dataset.tvOld=e.value;
      e.value='';
      e.addEventListener('blur',function h(){
        if(e.value===''&&e.dataset.tvOld)e.value=e.dataset.tvOld;
        delete e.dataset.tvEdit;delete e.dataset.tvOld;
        e.removeEventListener('blur',h);
      });
    }else{
      try{e.select();}catch(err){try{e.setSelectionRange(e.value.length,e.value.length);}catch(err2){}}
    }
  }
  function mark(doFocus){
    var a=items(); if(idx>=a.length)idx=a.length-1;
    a.forEach(function(e,i){if(e.tabIndex<0)e.tabIndex=0;e.classList.toggle('tv-focus',i===idx);});
    if(doFocus!==false&&idx>=0&&a[idx])focusItem(a[idx]);
  }
  function move(dx,dy){
    var a=items(); if(!a.length)return;
    var step=(dy>0||dx>0)?1:-1;
    var next=idx+step;
    if(next<0)next=a.length-1;
    if(next>=a.length)next=0;
    idx=next; mark();
  }
  document.addEventListener('keydown',function(e){
    var k=e.key||e.code, ae=document.activeElement, ed=editable(ae);
    // Arrows always navigate, even out of a text field, so the remote can
    // never get trapped in settings. Only printable keys stay in the field.
    if(k==='ArrowRight'||k==='Right'){e.preventDefault();if(ed)ae.blur();move(1,0);return;}
    if(k==='ArrowLeft'||k==='Left'){e.preventDefault();if(ed)ae.blur();move(-1,0);return;}
    if(k==='ArrowDown'||k==='Down'){e.preventDefault();if(ed)ae.blur();move(0,1);return;}
    if(k==='ArrowUp'||k==='Up'){e.preventDefault();if(ed)ae.blur();move(0,-1);return;}
    if(k==='Enter'||k==='OK'||k==='Accept'||e.keyCode===13){
      if(ed){e.preventDefault();ae.blur();mark(false);return;}
      var a=items(),t=a[idx];
      if(t){
        e.preventDefault();
        if((t.tagName||'').toLowerCase()==='select'){
          try{t.focus();}catch(err){}
          ['mousedown','mouseup','click'].forEach(function(n){
            t.dispatchEvent(new MouseEvent(n,{bubbles:true,cancelable:true,view:window}));
          });
        }else if(editable(t))focusItem(t);
        else t.click();
      }
      return;
    }
    if(k==='Backspace'||k==='BrowserBack'||k==='GoBack'||e.keyCode===461){
      if(!ed){e.preventDefault();history.back();}
      return;
    }
    if(k==='Escape'||k==='Esc'){
      if(ed){e.preventDefault();ae.blur();mark();}
      else{e.preventDefault();history.back();}
      return;
    }
    setTimeout(function(){if(!editable(document.activeElement))mark(false);},0);
  },true);
  // When the context menu opens, jump focus straight to its first button.
  if(menu&&window.MutationObserver){
    new MutationObserver(function(){
      if(!menu.classList.contains('context-menu-disabled')){
        var first=menu.querySelector('.context-menu-element');
        if(first){var a=items(),i=a.indexOf(first);if(i>=0){idx=i;mark();}}
      }
    }).observe(menu,{attributes:true,childList:true,subtree:true,attributeFilter:['class']});
  }
  document.addEventListener('DOMNodeInserted',function(){setTimeout(function(){if(!editable(document.activeElement))mark(false);},60);});
  setInterval(function(){if(!editable(document.activeElement))mark(false);},1500);
})();
</script>
