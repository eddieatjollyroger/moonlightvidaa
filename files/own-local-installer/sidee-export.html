<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Export Sidee Moonlight Backup</title>
<style>
body{background:#111;color:#eee;font:17px sans-serif;margin:20px}
h1{font-size:26px}button{font:16px sans-serif;margin:3px 4px;padding:7px 10px}
pre{white-space:pre-wrap;word-break:break-all;background:#000;padding:16px;min-height:180px}
.ok{color:#7f7}.bad{color:#f77}.warn{color:#fc3}
</style>
</head>
<body>
<h1>EXPORT SIDEE MOONLIGHT BACKUP</h1>
<p>DECODES INSTALLED BUNDLE. BASE64 GOES TO EXISTING METRICS LOG.</p>
<div>
<button id="export">1 EXPORT TO LOGS</button>
<button id="verify">2 VERIFY SOURCE</button>
</div>
<pre id="out">READY</pre>
<script>
var LOG='https://moonlight.joaopacheco.me:8444/api/log';
var SRC='emanual/Local_ebook/index.html';

function out(s,cls){var d=document.createElement('div');if(cls)d.className=cls;d.textContent=s;document.getElementById('out').appendChild(d);}
function clear(){document.getElementById('out').textContent='';}
function ok(s){out('OK '+s,'ok');}
function bad(s){out('FAIL '+s,'bad');}
function warn(s){out('NOTE '+s,'warn');}
function call(api,params){
  if(typeof HiUtils_createRequest!=='function')throw new Error('HIUTILS MISSING');
  return HiUtils_createRequest(api,params);
}
function isOk(r){return !!(r&&r.ret);}
function body(r){return (r&&typeof r.msg==='string')?r.msg:null;}
function read(path){
  var r=call('fileRead',{path:path,mode:6});
  if(!isOk(r))throw new Error('READ '+path+' '+JSON.stringify(r).slice(0,250));
  var t=body(r);if(t===null)throw new Error('NO BODY '+path);
  return t;
}
function post(tag,text){
  var s=String(text==null?'':text);
  var size=3000;
  var n=Math.max(1,Math.ceil(s.length/size));
  for(var i=0;i<n;i++){
    try{
      fetch(LOG,{method:'POST',body:'SIDEE '+tag+' '+i+'/'+n+' '+s.slice(i*size,(i+1)*size),mode:'no-cors',keepalive:true});
    }catch(e){}
  }
  return n;
}
function extract(text,key){
  var re=new RegExp('"'+key+'"\\s*:\\s*"([A-Za-z0-9+/=]{100,})"');
  var m=re.exec(text);
  return m?m[1]:null;
}
function b64ToBytes(b64){
  var bin=atob(b64);
  var bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return bytes;
}
async function gunzipB64(b64){
  if(typeof DecompressionStream==='undefined')throw new Error('NO DECOMPRESSIONSTREAM');
  var bytes=b64ToBytes(b64);
  var stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}
function toBase64(text){
  var bytes=new TextEncoder().encode(text);
  var bin='';
  for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);
  return btoa(bin);
}
async function sha256(text){
  if(!window.crypto||!crypto.subtle)return 'NA';
  var bytes=new TextEncoder().encode(text);
  var buf=await crypto.subtle.digest('SHA-256',bytes);
  var arr=new Uint8Array(buf);
  var hex='';
  for(var i=0;i<arr.length;i++)hex+=('0'+arr[i].toString(16)).slice(-2);
  return hex;
}
function head(text,n){return text.slice(0,n||100).replace(/\s+/g,' ');}

async function decodeInstalled(){
  var idx=read(SRC);
  var b64=extract(idx,'moonlight');
  if(!b64)throw new Error('NO MOONLIGHT BLOB');
  var html=await gunzipB64(b64);
  if(html.indexOf('<html')<0||html.indexOf('Moonlight')<0)throw new Error('DECODE LOOKS WRONG');
  return {idx:idx,b64:b64,html:html};
}

document.getElementById('export').addEventListener('click',async function(){
  clear();
  try{
    var d=await decodeInstalled();
    var bytes=new TextEncoder().encode(d.html);
    var hash=await sha256(d.html);
    var b64=toBase64(d.html);
    var n=post('BKUP',b64);
    post('BKUPINFO','SRC '+SRC+' BLOB '+d.b64.length+' UTF8 '+bytes.length);
    ok('SOURCE LEN '+d.idx.length);
    ok('BLOB LEN '+d.b64.length);
    ok('HTML BYTES '+bytes.length);
    ok('BASE64 LEN '+b64.length);
    ok('CHUNKS '+n);
    ok('SHA256 '+hash);
    warn('SAVE BKUP LINKS FROM LOGS');
  }catch(e){bad(e.message);}
});

document.getElementById('verify').addEventListener('click',async function(){
  clear();
  try{
    var d=await decodeInstalled();
    ok('SOURCE LEN '+d.idx.length);
    ok('DECODED LEN '+d.html.length);
    ok('HEAD '+head(d.html,120));
  }catch(e){bad(e.message);}
});
</script>
</body>
</html>
