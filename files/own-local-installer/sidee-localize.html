<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Make Local Moonlight Copy</title>
<style>
body{background:#111;color:#eee;font:17px sans-serif;margin:20px}
h1{font-size:26px}button{font:16px sans-serif;margin:3px 4px;padding:7px 10px}
pre{white-space:pre-wrap;word-break:break-all;background:#000;padding:16px;min-height:180px}
.ok{color:#7f7}.bad{color:#f77}.warn{color:#fc3}
</style>
</head>
<body>
<h1>MAKE LOCAL MOONLIGHT COPY</h1>
<p>READS YOUR INSTALLED BUNDLE. WRITES A NEW FLAT FILE YOU CAN MAINTAIN.</p>
<div>
<button id="make">1 DECODE + WRITE LOCAL</button>
<button id="verify">2 VERIFY LOCAL</button>
</div>
<pre id="out">READY</pre>
<script>
var ROOT='emanual/Local_ebook/';
var SRC=ROOT+'index.html';
var DST=ROOT+'ownmoon-local.html';

function out(s,cls){var d=document.createElement('div');if(cls)d.className=cls;d.textContent=s;document.getElementById('out').appendChild(d);}
function clear(){document.getElementById('out').textContent='';}
function ok(s){out('OK '+s,'ok');}
function bad(s){out('FAIL '+s,'bad');}
function warn(s){out('NOTE '+s,'warn');}
function call(api,params){
  if(typeof HiUtils_createRequest!=='function')throw new Error('HIUTILS MISSING');
  return HiUtils_createRequest(api,params);
}
function isOk(r){return !!(r&&r.ret);}
function body(r){return (r&&typeof r.msg==='string')?r.msg:null;}
function read(path){
  var r=call('fileRead',{path:path,mode:6});
  if(!isOk(r))throw new Error('READ '+path+' '+JSON.stringify(r).slice(0,250));
  var t=body(r);if(t===null)throw new Error('NO BODY '+path);
  return t;
}
function write(path,text){
  var r=call('fileWrite',{path:path,mode:6,writedata:text});
  if(!isOk(r))throw new Error('WRITE '+path+' '+JSON.stringify(r).slice(0,250));
}
function extract(text,key){
  var re=new RegExp('"'+key+'"\\s*:\\s*"([A-Za-z0-9+/=]{100,})"');
  var m=re.exec(text);
  return m?m[1]:null;
}
function b64ToBytes(b64){
  var bin=atob(b64);
  var bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return bytes;
}
async function gunzipB64(b64){
  if(typeof DecompressionStream==='undefined')throw new Error('NO DECOMPRESSIONSTREAM');
  var bytes=b64ToBytes(b64);
  var stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}
function head(text,n){return text.slice(0,n||100).replace(/\s+/g,' ');}

async function makeLocal(){
  clear();
  try{
    var idx=read(SRC);
    ok('SOURCE LEN '+idx.length);
    var b64=extract(idx,'moonlight');
    if(!b64)throw new Error('NO MOONLIGHT BLOB');
    ok('BLOB LEN '+b64.length);
    var html=await gunzipB64(b64);
    if(html.indexOf('<html')<0||html.indexOf('Moonlight')<0)throw new Error('DECODE LOOKS WRONG');
    ok('DECODED LEN '+html.length);
    write(DST,html);
    var check=read(DST);
    if(check.length!==html.length)throw new Error('VERIFY LEN '+check.length+' != '+html.length);
    ok('LOCAL FILE WRITTEN '+check.length);
    ok('HEAD '+head(check,120));
    warn('NOW INSTALL TILE FOR ownmoon-local.html');
  }catch(e){bad(e.message);}
}

document.getElementById('make').addEventListener('click',makeLocal);
document.getElementById('verify').addEventListener('click',function(){
  clear();
  try{
    var t=read(DST);
    ok('LOCAL LEN '+t.length);
    ok('HEAD '+head(t,120));
  }catch(e){bad(e.message);}
});
</script>
</body>
</html>
