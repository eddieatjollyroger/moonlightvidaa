# Tiny read-only static server for our own Moonlight WebRTC client.
# Copy the client to ~/own-webrtc on the Pi, this file to ~/own-webrtc-serve/,
# then run: cd ~/own-webrtc-serve && docker compose up -d
services:
  own-webrtc:
    image: python:3.11-alpine
    container_name: own-webrtc
    restart: unless-stopped
    ports:
      - "8485:80"
    volumes:
      - ../own-webrtc:/srv:ro
    command: ["python", "-m", "http.server", "80", "--bind", "0.0.0.0", "--directory", "/srv"]
